<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Eye Blink Detector — Camera Permission</title>
  <style>
    body { font: 14px system-ui; max-width: 520px; margin: 60px auto; padding: 24px; color: #0f172a; }
    h1 { font-size: 20px; }
    p { line-height: 1.5; color: #475569; }
    button { padding: 10px 18px; font-size: 14px; cursor: pointer; background: #2563eb; color: #fff; border: none; border-radius: 6px; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .status { margin-top: 16px; font-size: 13px; }
    .ok { color: #16a34a; }
    .err { color: #dc2626; }
  </style>
</head>
<body>
  <h1>Allow camera access</h1>
  <p>Eye Blink Detector needs your camera to count blinks. The camera feed never leaves this browser — no frame is uploaded anywhere.</p>
  <p>Click the button below. Chrome will ask you to allow the camera. Once allowed, you can close this tab and the extension will work.</p>
  <button id="grant">Grant camera access</button>
  <div class="status" id="status"></div>
  <script type="module" src="./permission.ts"></script>
</body>
</html>
