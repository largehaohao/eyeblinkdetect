<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eye Blink Detector</title>
  <link rel="icon" type="image/png" href="../icons/icon-32.png">
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
  <header class="popup-header">
    <div class="brand-mark" aria-hidden="true"><img src="../icons/eye-blink.svg" width="38" height="38" alt=""></div>
    <div><h1>Eye Blink</h1><p class="hint">A little care for your eyes.</p></div>
  </header>
  <main>
    <div class="status-pill" id="state" role="status">Connecting…</div>
    <section class="metric" aria-label="Recent blink rate">
      <div class="big" id="bpm">—</div>
      <div class="metric-unit">blinks / minute</div>
      <p class="hint">Last 5 completed minutes</p>
    </section>
    <div class="chart-heading"><span>Your recent rhythm</span><span class="hint">Past hour</span></div>
    <div class="chart"><canvas id="recent" role="img" aria-label="Blink rate over the past hour"></canvas><p class="chart-empty" id="chart-empty" hidden>No recent activity</p></div>
    <p id="status-detail" class="status-detail" aria-live="polite">Checking your session…</p>
    <div class="notice" id="feedback" role="status" hidden></div>
    <button id="toggle" class="primary-action" disabled>Connecting…</button>
    <button id="retry" hidden>Try again</button>
    <div class="secondary-actions">
      <button id="calibrate" disabled>Calibrate</button>
      <a class="button-link" href="../dashboard/dashboard.html" target="_blank" rel="noopener">Open dashboard <span aria-hidden="true">↗</span></a>
    </div>
  </main>
  <footer><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg> On-device detection. Your video stays private.</footer>
  <script type="module" src="./popup.ts"></script>
</body>
</html>
